<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NeoNet Encurtador — Grupo Zyntra</title>
<link rel="icon" href="https://files.catbox.moe/t696qp.png">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1535700125494684" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #0b0c0e;
    --bg-card: #13151a;
    --primary: #00b159;
    --primary-hover: #00964b;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border-color: #242936;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    transition: all 0.2s ease;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.6;
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .main-container {
    max-width: 650px;
    width: 100%;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 40px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
  }

  header {
    text-align: center;
    margin-bottom: 35px;
  }

  .brand-badge {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 10px;
    display: inline-block;
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    color: var(--text-main);
    letter-spacing: 0.5px;
  }

  header p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 5px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    background-color: #1a1d26;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(0, 177, 89, 0.15);
  }

  button.btn-primary {
    width: 100%;
    padding: 14px;
    background-color: var(--primary);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0, 177, 89, 0.2);
  }

  button.btn-primary:hover {
    background-color: var(--primary-hover);
    transform: translateY(-1px);
  }

  /* Painel de Resultados */
  .result-panel {
    margin-top: 35px;
    border-top: 1px solid var(--border-color);
    padding-top: 30px;
    display: none; /* Oculto até gerar */
  }

  .result-box {
    background-color: #1a1d26;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .result-box h3 {
    font-size: 0.9rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .result-box a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
    word-break: break-all;
    font-size: 1.05rem;
  }

  .result-box a:hover {
    text-decoration: underline;
  }

  .btn-secondary {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 16px;
    background-color: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    border-radius: 4px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .btn-secondary:hover {
    border-color: var(--text-muted);
    background-color: rgba(255,255,255,0.02);
  }

  /* Display Flex para QR e Preview */
  .visual-output {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 20px;
    align-items: center;
    margin-top: 20px;
  }

  #qr-container {
    background: #fff;
    padding: 10px;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 140px;
    height: 140px;
  }

  #qr {
    width: 120px !important;
    height: 120px !important;
  }

  .preview-container {
    background-color: #1a1d26;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 20px;
    height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  /* Rodapé Corporativo */
  footer {
    margin-top: 50px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    width: 100%;
    max-width: 650px;
    border-top: 1px solid var(--border-color);
    padding-top: 25px;
  }

  .footer-links {
    margin-top: 10px;
  }

  .footer-links a {
    color: var(--text-muted);
    text-decoration: none;
    margin: 0 10px;
  }

  .footer-links a:hover {
    color: var(--primary);
  }
</style>
</head>
<body>

<div class="main-container">
  <header>
    <span class="brand-badge">Zyntra Infrastructure</span>
    <h1>NeoNet Encurtador</h1>
    <p>Gerenciamento, otimização e parametrização segura de links</p>
  </header>

  <div class="form-group">
    <label for="inputLink">URL de Destino</label>
    <input type="text" id="inputLink" placeholder="https://exemplo.com/item-afiliado" autocomplete="off" />
  </div>

  <div class="form-group">
    <label for="inputNome">Identificador do Link (Slug)</label>
    <input type="text" id="inputNome" placeholder="nome-do-produto" autocomplete="off" />
  </div>

  <button class="btn-primary" onclick="gerar()">Otimizar Hiperlink</button>

  <div id="resultPanel" class="result-panel">
    <div class="result-box">
      <h3>Link Parametrizado</h3>
      <div id="outputLinkContainer"></div>
    </div>

    <div class="visual-output">
      <div id="qr-container">
        <canvas id="qr"></canvas>
      </div>
      <div class="preview-container">
        <span style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; display: block; text-transform: uppercase;">Prévia Estrutural</span>
        <div id="previewBtnContainer"></div>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 <span>Grupo Zyntra Tech</span>. Todos os direitos reservados.</p>
  <div class="footer-links">
    <a href="termos.html" target="_blank">Termos de Uso</a> • 
    <a href="privacidade.html" target="_blank">Privacidade</a> • 
    <a href="vlog.html" target="_blank">Portal News</a>
  </div>
</footer>

<script>
  function gerar() {
    let link = document.getElementById('inputLink').value.trim();
    const nome = document.getElementById('inputNome').value.trim().replace(/\s+/g, '-').toLowerCase();

    if(!link || !nome) {
      alert("Por favor, preencha todos os campos do formulário.");
      return;
    }

    // Normalização do protocolo de rede
    if (!/^https?:\/\//i.test(link)) {
      link = 'https://' + link;
    }

    const redirectLink = `redirect.html?url=${encodeURIComponent(link)}`;
    const fakeLink = window.location.href.replace(/index\.html$/, '') + nome;

    // Torna o painel visível
    document.getElementById('resultPanel').style.display = 'block';

    // Injeta o Link Gerado
    document.getElementById('outputLinkContainer').innerHTML = `
      <a href="${redirectLink}" target="_blank">${fakeLink}</a><br/>
      <button class="btn-secondary" onclick="copyHTML('${redirectLink}')">Copiar Código do Botão HTML</button>
    `;

    // Injeta a Prévia Real do Botão
    document.getElementById('previewBtnContainer').innerHTML = `
      <a href="${redirectLink}" target="_blank" style="text-decoration: none;">
        <button style="padding: 10px 22px; background-color: var(--primary); color: #ffffff; border: none; border-radius: 4px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.9rem; cursor: pointer;">Comprar Agora</button>
      </a>
    `;

    // Renderiza o QR Code com tratamento nativo
    QRCode.toCanvas(document.getElementById('qr'), redirectLink, {
      margin: 0,
      scale: 4
    }, function (error) {
      if (error) console.error(error);
    });
  }

  function copyHTML(link) {
    const html = `<a href="${link}" target="_blank"><button style="padding: 12px 24px; background-color: #00b159; color: #ffffff; border: none; border-radius: 4px; font-family: sans-serif; font-weight: 600; cursor: pointer;">Comprar Agora</button></a>`;
    navigator.clipboard.writeText(html).then(() => {
      alert("Snippet HTML copiado para a área de transferência!");
    });
  }
</script>
</body>
</html>
