<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zyntra News — Portal Oficial Neo Net</title>
<link rel="icon" href="https://files.catbox.moe/t696qp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chronicle+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #0b0c0e;
    --bg-card: #13151a;
    --bg-nav: #181b22;
    --primary: #00b159;
    --primary-light: #33cc7a;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border-color: #242936;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    max-width: 1140px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
  }

  header {
    background-color: var(--bg-main);
    padding: 30px 0;
    border-bottom: 1px solid var(--border-color);
    text-align: center;
  }

  .zyntra-badge {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 8px;
    display: inline-block;
  }

  header h1 {
    font-family: 'Georgia', serif;
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text-main);
    margin-bottom: 6px;
  }

  header p {
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 400;
  }

  .nav-bar {
    background-color: var(--bg-nav);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .nav-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 60px;
  }

  nav a {
    color: var(--text-muted);
    margin-right: 25px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.9rem;
    transition: color 0.2s;
  }

  nav a:hover, nav a.active { color: var(--primary); }

  .search-box { position: relative; width: 300px; }

  .search-box input {
    width: 100%;
    background-color: #1e222b;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px 14px 8px 36px;
    color: var(--text-main);
    font-size: 0.85rem;
    outline: none;
    transition: all 0.2s;
  }

  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(0, 177, 89, 0.15);
  }

  .search-box ::placeholder { color: #64748b; }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border: 2px solid #64748b;
    border-radius: 50%;
  }
  .search-icon::after {
    content: '';
    position: absolute;
    width: 6px;
    height: 2px;
    background: #64748b;
    transform: rotate(45deg);
    top: 10px;
    left: 10px;
  }

  main {
    flex: 1;
    padding: 40px 0;
  }

  .news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
  }

  .news-grid article:first-of-type {
    grid-column: span 3;
    display: grid;
    grid-template-columns: 1fr;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 35px;
  }
  
  .news-grid article:first-of-type h2 {
    font-size: 2.2rem;
    font-family: 'Georgia', serif;
  }

  article {
    background-color: transparent;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 25px;
    margin-bottom: 5px;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 769px) {
    .news-grid article { grid-column: span 1; }
  }

  @media (max-width: 768px) {
    .news-grid { grid-template-columns: 1fr; }
    .news-grid article:first-of-type { grid-column: span 1; }
    .nav-wrapper { flex-direction: column; height: auto; padding: 15px 0; gap: 15px; }
    .search-box { width: 100%; }
  }

  article h2 {
    color: var(--text-main);
    font-size: 1.35rem;
    font-weight: 600;
    margin-bottom: 10px;
    line-height: 1.3;
    transition: color 0.2s;
  }

  article h2 a {
    color: inherit;
    text-decoration: none;
  }

  article h2 a:hover { color: var(--primary); }

  .meta-info {
    display: flex;
    gap: 12px;
    align-items: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 15px;
  }

  .category {
    color: var(--primary);
    font-weight: 600;
  }

  article .content-preview {
    color: #cbd5e1;
    font-size: 0.95rem;
    line-height: 1.6;
    word-break: break-word;
  }

  .content-preview a { color: var(--primary-light); text-decoration: none; font-weight: 500;}
  .content-preview a:hover { text-decoration: underline; }

  .status-container {
    grid-column: span 3;
    text-align: center;
    padding: 50px;
    color: var(--text-muted);
    border: 1px dashed var(--border-color);
    border-radius: 8px;
  }

  .highlight {
    background-color: rgba(0, 177, 89, 0.25);
    color: #fff;
    padding: 0 2px;
    border-radius: 2px;
  }

  footer {
    background-color: #090a0c;
    border-top: 1px solid var(--border-color);
    padding: 30px 0;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  footer span { color: var(--text-main); font-weight: 500; }
</style>
</head>
<body>

<header>
  <div class="container">
    <span class="zyntra-badge">Zyntra Ecosystem Network</span>
    <h1>Neo Net Corporate News</h1>
    <p>Jornalismo de tecnologia, infraestrutura global e segurança da informação</p>
  </div>
</header>

<div class="nav-bar">
  <div class="container nav-wrapper">
    <nav>
      <a href="#" class="active">Geral</a>
      <a href="#">Tecnologia</a>
      <a href="#">Segurança</a>
      <a href="#">Corporativo</a>
    </nav>
    <div class="search-box">
      <div class="search-icon"></div>
      <input type="text" id="searchInput" placeholder="Pesquisar notícias ou termos..." autocomplete="off">
    </div>
  </div>
</div>

<main class="container">
  <div class="news-grid" id="articlesContainer">
    <div class="status-container">Buscando notícias em tempo real...</div>
  </div>
</main>

<footer>
  <div class="container">
    <p>© 2026 <span>Grupo Zyntra Tech</span>. Conteúdo estritamente informativo. Todos os direitos reservados.</p>
  </div>
</footer>

<script>
  let bancoArtigos = [];

  async function carregarArtigos() {
    const container = document.getElementById('articlesContainer');
    try {
      // Usamos o RSS do Google News Brasil sobre Tecnologia
      const rssUrl = encodeURIComponent('https://news.google.com/rss/topics/CAAqJggKIiBDQkFTRWdvSUwyMHZNRGRqTVhZU0FtVnVHZ0pWVXlnQVAB?hl=pt-BR&gl=BR&ceid=BR:pt-419');
      // Passamos pelo rss2json para converter o XML em JSON e liberar o bloqueio de CORS do navegador
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error('Falha na resposta da API');
      
      const data = await response.json();
      
      if (data.status !== 'ok') throw new Error('Erro ao processar feed RSS');

      // Mapeia o JSON retornado para o formato que a página já usa
      bancoArtigos = data.items.map(item => {
        // O Google News retorna o conteúdo com tags HTML pesadas. 
        // Vamos extrair apenas o texto puro para ficar limpo no layout.
        const div = document.createElement('div');
        div.innerHTML = item.description;
        let textoLimpo = div.textContent || div.innerText || "";
        
        // Formatação da data (vem no formato "YYYY-MM-DD HH:MM:SS")
        const dataFormatada = item.pubDate.split(' ')[0]; 

        return {
          titulo: item.title,
          conteudo: textoLimpo.substring(0, 180) + `... <br><br><a href="${item.link}" target="_blank">Ler matéria completa ↗</a>`,
          data: dataFormatada,
          link: item.link
        };
      });

      renderizarArtigos(bancoArtigos);
      
    } catch (error) {
      container.innerHTML = `<div class="status-container">Erro ao estabelecer conexão com a fonte de notícias do Google. <br>Detalhes: ${error.message}</div>`;
    }
  }

  function renderizarArtigos(lista, termoBusca = '') {
    const container = document.getElementById('articlesContainer');
    
    if (lista.length === 0) {
      container.innerHTML = `<div class="status-container">Nenhum artigo localizado para o termo correspondente.</div>`;
      return;
    }

    container.innerHTML = lista.map((artigo, idx) => {
      let tituloFinal = artigo.titulo;
      let conteudoFinal = artigo.conteudo;
      
      if (termoBusca) {
        const regex = new RegExp(`(${escapeRegExp(termoBusca)})`, 'gi');
        tituloFinal = tituloFinal.replace(regex, '<span class="highlight">$1</span>');
        conteudoFinal = conteudoFinal.replace(regex, '<span class="highlight">$1</span>');
      }

      let categoria = 'Tecnologia';
      const tituloLower = artigo.titulo.toLowerCase();
      if(tituloLower.includes('ia') || tituloLower.includes('inteligência') || tituloLower.includes('chatgpt')) categoria = 'Inteligência Artificial';
      else if(tituloLower.includes('cibersegurança') || tituloLower.includes('segurança') || tituloLower.includes('hacker')) categoria = 'Segurança';
      else if(tituloLower.includes('google') || tituloLower.includes('apple') || tituloLower.includes('microsoft')) categoria = 'Big Tech';
      else if(tituloLower.includes('celular') || tituloLower.includes('smartphone')) categoria = 'Mobile';

      return `
        <article>
          <div class="meta-info">
            <span class="category">${categoria}</span>
            <span>•</span>
            <span>${formatarData(artigo.data)}</span>
          </div>
          <h2><a href="${artigo.link}" target="_blank">${tituloFinal}</a></h2>
          <div class="content-preview">${conteudoFinal}</div>
        </article>
      `;
    }).join('');
  }

  document.getElementById('searchInput').addEventListener('input', function(e) {
    const termo = e.target.value.trim().toLowerCase();
    
    if (!termo) {
      renderizarArtigos(bancoArtigos);
      return;
    }

    const filtrados = bancoArtigos.filter(artigo => 
      artigo.titulo.toLowerCase().includes(termo) || 
      artigo.conteudo.toLowerCase().includes(termo)
    );

    renderizarArtigos(filtrados, termo);
  });

  function formatarData(dataString) {
    if(!dataString.includes('-')) return dataString; 
    const partes = dataString.split('-');
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  document.addEventListener('DOMContentLoaded', carregarArtigos);
</script>

</body>
</html>
